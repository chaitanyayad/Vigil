[project]
name = "vigil-agent"
version = "0.1.0"
description = "VIGIL observer agent - psutil metric sampling + heartbeats"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vigil_agent"]
