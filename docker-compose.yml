name: vigil

services:
  timescaledb:
    # -ha image ships TimescaleDB *and* pgvector on Postgres 16
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      # host 5433 -> container 5432 (5432 is commonly taken by a host Postgres)
      - "5433:5432"
    volumes:
      - tsdb-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 12

  contracts-deploy:
    image: ghcr.io/foundry-rs/foundry:stable
    working_dir: /contracts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - forge script script/Deploy.s.sol:Deploy --rpc-url http://anvil:8545 --broadcast --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    volumes:
      - ./contracts:/contracts
    depends_on:
      anvil:
        condition: service_healthy
    restart: "no"

  orchestrator:
    build: ./orchestrator
    environment:
      DATABASE_URL: postgresql+asyncpg://vigil:vigil@timescaledb:5432/vigil
      DATABASE_URL_SYNC: postgresql://vigil:vigil@timescaledb:5432/vigil
      REDIS_URL: redis://redis:6379/0
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-do-not-use-in-prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      LEDGER_ENABLED: ${LEDGER_ENABLED:-true}
      CHAIN_RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      LEDGER_PRIVATE_KEY: ${LEDGER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      LEDGER_CONTRACT_ADDRESS: ${LEDGER_CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      ML_ARTIFACT_DIR: /data/ml_artifacts
    ports:
      - "8000:8000"
    volumes:
      - ml-artifacts:/data/ml_artifacts
      - ./runbooks:/app/runbooks:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      anvil:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  agent-1:
    build: ./agent
    environment:
      VIGIL_ORCHESTRATOR_URL: http://orchestrator:8000
      VIGIL_AGENT_NAME: agent-1
      # Auto-registration bootstrap: agents self-register in dev using the admin login
      VIGIL_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      VIGIL_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    depends_on:
      orchestrator:
        condition: service_healthy

  agent-2:
    build: ./agent
    environment:
      VIGIL_ORCHESTRATOR_URL: http://orchestrator:8000
      VIGIL_AGENT_NAME: agent-2
      VIGIL_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      VIGIL_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    depends_on:
      orchestrator:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - orchestrator

volumes:
  tsdb-data:
  ml-artifacts:
